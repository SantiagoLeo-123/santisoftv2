<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b53"/>
      <stop offset="100%" stop-color="#b3001b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1a35" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ff002b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fundo escuro estilo app iOS -->
  <rect width="512" height="512" rx="115" fill="#0c0c10"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>

  <!-- Letra S estilizada -->
  <g filter="url(#shadow)">
    <!-- Curva superior do S -->
    <path d="M 330 165 C 330 120, 290 100, 256 100 C 205 100, 175 130, 175 165 C 175 225, 335 220, 335 320 C 335 385, 285 412, 256 412 C 200 412, 170 375, 170 335" 
          fill="none" 
          stroke="url(#redGradient)" 
          stroke-width="52" 
          stroke-linecap="round"/>

    <!-- Linha de Eletrocardiograma (ECG/Pulso Médico) -->
    <path d="M 85 260 L 175 260 L 195 230 L 215 285 L 245 180 L 275 330 L 300 245 L 320 270 L 335 260 L 425 260" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
